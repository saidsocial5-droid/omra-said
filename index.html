<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<meta name="description" content="رفيق العمرة — دليلك الذكي خلال رحلة العمرة: المناسك، الأذكار، الأدعية، المزارات، الخرائط ومواقيت الصلاة">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رفيق العمرة">
<title>رفيق العمرة</title>
<style>
:root{
  --green:#0b3d2e;--green2:#13573f;--green3:#e8f2ec;--gold:#c9a14a;--gold2:#f5ead0;
  --ink:#1d2a24;--muted:#5f6f67;--bg:#f7f5ef;--card:#fff;--line:#e4dfd2;--red:#b3412f;
  --r:16px;--shadow:0 2px 10px rgba(11,61,46,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Noto Naskh Arabic","Amiri","Segoe UI",Tahoma,"Geeza Pro",serif;background:var(--bg);color:var(--ink);line-height:1.8;font-size:17px;padding-bottom:84px}
header{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:18px 18px 22px;padding-top:max(18px,env(safe-area-inset-top));position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10% 120%,rgba(201,161,74,.35),transparent 55%);pointer-events:none}
header h1{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
header .sub{opacity:.85;font-size:14px}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.card h2{margin:0 0 8px;font-size:19px;color:var(--green)}
.card h3{margin:10px 0 4px;font-size:17px;color:var(--green2)}
.muted{color:var(--muted);font-size:14px}
.gold{color:var(--gold)}
.hero{background:linear-gradient(135deg,#fff,var(--gold2));border:1px solid #ecdcb2}
.big{font-size:28px;font-weight:700;color:var(--green)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{display:inline-block;background:var(--green3);color:var(--green);border-radius:999px;padding:2px 12px;font-size:13px}
.pill.gold{background:var(--gold2);color:#8a6a1f}
button,.btn{font-family:inherit;font-size:16px;border:0;border-radius:12px;padding:10px 16px;background:var(--green);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.light{background:var(--green3);color:var(--green)}
.btn.goldb{background:var(--gold);color:#fff}
.btn.danger{background:#fbe9e6;color:var(--red)}
.btn.sm{padding:6px 12px;font-size:14px}
input,select,textarea{font-family:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
label{font-size:14px;color:var(--muted)}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:50;box-shadow:0 -2px 12px rgba(0,0,0,.05)}
nav.bottom button{background:none;color:var(--muted);flex-direction:column;gap:0;padding:4px 6px;font-size:12px;flex:1}
nav.bottom button .ic{font-size:22px;line-height:1.2}
nav.bottom button.on{color:var(--green);font-weight:700}
nav.bottom button.on .ic{transform:scale(1.12)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.tabs button{white-space:nowrap;background:#fff;color:var(--green);border:1px solid var(--line);padding:6px 14px;font-size:15px}
.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.dua{background:#fffdf7;border-right:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:19px;line-height:2}
.dua .src{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.dua .cnt{float:left;margin-right:8px}
.counter{border:2px solid var(--gold);background:#fff;color:var(--green);border-radius:12px;min-width:64px;padding:4px 10px;font-size:15px}
.counter.done{background:var(--green);color:#fff;border-color:var(--green)}
.step{display:flex;gap:12px;align-items:flex-start}
.step .num{flex:0 0 38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.step.done .num{background:var(--gold)}
details{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;background:#fff}
details summary{cursor:pointer;font-weight:700;color:var(--green);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"◂ ";color:var(--gold)}
details[open] summary::before{content:"▾ "}
ul.clean{padding-right:20px;margin:6px 0}
.check{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.check input{width:22px;height:22px;flex:0 0 22px;accent-color:var(--green)}
.check.ok span{text-decoration:line-through;color:var(--muted)}
.ring{width:190px;height:190px;border-radius:50%;margin:10px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--green3) 0);position:relative;user-select:none;cursor:pointer}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.ring>*{position:relative}
.ring .n{font-size:54px;font-weight:700;color:var(--green);line-height:1}
.prayer{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line)}
.prayer.next{background:var(--gold2);border-radius:10px;padding:8px 10px;font-weight:700}
.place{display:flex;gap:12px}
.place .em{font-size:30px;flex:0 0 40px;text-align:center}
.map{width:100%;height:330px;border:0;border-radius:12px;background:var(--green3)}
.day{border-right:4px solid var(--green3);padding:4px 12px;margin:10px 0}
.day.today{border-color:var(--gold);background:var(--gold2);border-radius:10px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.3s;z-index:99;pointer-events:none}
.toast.show{opacity:1}
.search{margin-bottom:10px}
.hidden{display:none!important}
.now-box{background:var(--green);color:#fff;border:0}
.now-box h2{color:var(--gold2)}
.now-box .muted{color:#cfe3d8}
.warn{background:#fff6e5;border:1px solid #f0d9a5;border-radius:12px;padding:10px 12px;font-size:15px}
.fs-big .dua{font-size:23px}
@media (min-width:600px){body{font-size:18px}}
</style>
</head>
<body>
<header>
  <h1>🕋 رفيق العمرة</h1>
  <div class="sub" id="hdrDate"></div>
</header>

<main class="wrap" id="app"></main>

<nav class="bottom" id="nav">
  <button data-v="home" class="on"><span class="ic">🏠</span>الرئيسية</button>
  <button data-v="manasik"><span class="ic">🕋</span>المناسك</button>
  <button data-v="adhkar"><span class="ic">📿</span>الأذكار</button>
  <button data-v="places"><span class="ic">🗺️</span>المزارات</button>
  <button data-v="more"><span class="ic">☰</span>المزيد</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ================== التخزين ================== */
const S = {
  get(k, d){ try{ const v = localStorage.getItem('umrah_'+k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('umrah_'+k, JSON.stringify(v)); }catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function vib(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
const AR = n => String(n).replace(/\d/g, d=>'٠١٢٣٤٥٦٧٨٩'[d]);

/* ================== الإعدادات ================== */
const settings = Object.assign({
  start: '', days: 15, order: 'mecca', meccaDays: 8, city: 'auto', big: false, name: ''
}, S.get('settings', {}));
function saveSettings(){ S.set('settings', settings); }

/* ================== البيانات: المناسك ================== */
const STEPS = [
  { t:'الاستعداد قبل الميقات', body:`
    <ul class="clean">
      <li>الاغتسال كغسل الجنابة (سنة للرجل والمرأة، حتى الحائض والنفساء).</li>
      <li>تطييب البدن (للرجل) لا ثياب الإحرام، وتقليم الأظافر وأخذ ما يُشرع أخذه.</li>
      <li>الرجل يلبس إزاراً ورداءً أبيضين نظيفين ونعلين، والمرأة تلبس ما شاءت من الثياب الساترة غير المتبرجة، ولا تلبس النقاب ولا القفازين.</li>
    </ul>
    <div class="warn">✈️ <b>إن كنت قادماً جواً من المغرب إلى جدة:</b> الميقات يُحاذى في الطائرة (ميقات الجحفة/رابغ)، فالبس الإحرام في المطار أو قبل الإقلاع، وانوِ عند إعلان الطيار محاذاة الميقات. <br>🕌 <b>إن بدأت بالمدينة:</b> ميقاتك ذو الحليفة (مسجد الميقات / أبيار علي) عند خروجك إلى مكة.</div>` },
  { t:'الإحرام ونية العمرة', body:`
    <p>عند الميقات تنوي الدخول في النسك وتقول:</p>
    <div class="dua">لبيك عمرة</div>
    <p>وإن خشيت عائقاً (مرض ونحوه) تشترط:</p>
    <div class="dua">اللهم مَحِلّي حيث حبستني</div>
    <details><summary>محظورات الإحرام</summary>
      <ul class="clean">
        <li>إزالة الشعر وتقليم الأظافر.</li><li>استعمال الطيب في البدن أو الثوب بعد الإحرام.</li>
        <li>للرجل: لبس المخيط (القميص، السراويل…) وتغطية الرأس بملاصق.</li>
        <li>للمرأة: النقاب والقفازان (وتستر وجهها عن الرجال الأجانب بغير النقاب كالخمار المسدول).</li>
        <li>قتل الصيد البري، وعقد النكاح، والجماع ومقدماته.</li>
      </ul>
      <p class="muted">من فعل محظوراً ناسياً أو جاهلاً فلا شيء عليه، ويتوقف فوراً متى تذكّر.</p>
    </details>` },
  { t:'التلبية', body:`
    <p>يكثر منها الرجل رافعاً صوته، والمرأة تُسِرّ بها، من الإحرام حتى يبدأ الطواف.</p>
    <div class="dua">لبيك اللهم لبيك، لبيك لا شريك لك لبيك، إن الحمد والنعمة لك والملك، لا شريك لك<span class="src">متفق عليه</span></div>` },
  { t:'دخول المسجد الحرام', body:`
    <p>قدّم رجلك اليمنى وقل:</p>
    <div class="dua">بسم الله، والصلاة والسلام على رسول الله، اللهم افتح لي أبواب رحمتك<span class="src">رواه مسلم وغيره</span></div>
    <p>عند رؤية الكعبة: ادعُ بما تحب، فهو موطن خشوع ورجاء.</p>
    <p class="muted">💡 احفظ رقم الباب الذي دخلت منه وصوِّره، واتفق مع رفيقك على مكان لقاء ثابت.</p>` },
  { t:'الطواف (٧ أشواط)', body:`
    <ul class="clean">
      <li>يُشترط الطهارة من الحدثين وستر العورة.</li>
      <li><b>الاضطباع</b> للرجل: يجعل وسط الرداء تحت إبطه الأيمن وطرفيه على كتفه الأيسر — في طواف العمرة فقط.</li>
      <li>ابدأ من <b>الحجر الأسود</b> (الخط البني على الأرض سابقاً / محاذاة الحجر) واجعل الكعبة عن يسارك.</li>
      <li>استلم الحجر وقبّله إن تيسّر بلا مزاحمة، وإلا أشر إليه بيدك وقل: <b>الله أكبر</b>.</li>
      <li><b>الرَّمَل</b> (الإسراع مع مقاربة الخطى) للرجل في الأشواط الثلاثة الأولى إن أمكن.</li>
      <li>الركن اليماني: يُستلم باليد إن تيسّر بلا تقبيل ولا إشارة.</li>
      <li>بين الركن اليماني والحجر الأسود قل:</li>
    </ul>
    <div class="dua">ربنا آتنا في الدنيا حسنة، وفي الآخرة حسنة، وقنا عذاب النار<span class="src">رواه أبو داود</span></div>
    <div class="warn">📌 لا يوجد دعاء مخصّص لكل شوط؛ ادعُ بما تشاء واذكر الله واقرأ القرآن. استعمل <b>عدّاد الطواف</b> في الأسفل حتى لا تنسى العدد.</div>` },
  { t:'ركعتا الطواف وزمزم', body:`
    <ul class="clean">
      <li>غطِّ كتفك الأيمن (انتهى الاضطباع).</li>
      <li>صلِّ ركعتين خلف مقام إبراهيم إن تيسّر وإلا ففي أي مكان من المسجد، تقرأ في الأولى <b>الكافرون</b> وفي الثانية <b>الإخلاص</b>.</li>
      <li>اشرب من ماء زمزم وادعُ: «ماء زمزم لِما شُرب له» (رواه ابن ماجه).</li>
    </ul>` },
  { t:'السعي بين الصفا والمروة (٧ أشواط)', body:`
    <p>عند الدنو من الصفا (أول مرة فقط) اقرأ:</p>
    <div class="dua">﴿إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَائِرِ اللَّهِ﴾ أبدأ بما بدأ الله به</div>
    <p>ثم اصعد الصفا واستقبل الكعبة وارفع يديك وقل ثلاث مرات مع الدعاء بينها:</p>
    <div class="dua">الله أكبر، الله أكبر، الله أكبر، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، لا إله إلا الله وحده، أنجز وعده، ونصر عبده، وهزم الأحزاب وحده<span class="src">رواه مسلم</span></div>
    <ul class="clean">
      <li>الذهاب من الصفا إلى المروة شوط، والرجوع شوط آخر؛ تبدأ بالصفا وتنتهي بالمروة.</li>
      <li>يسعى الرجل سعياً شديداً بين <b>العلمين الأخضرين</b> (الإضاءة الخضراء)، والمرأة تمشي.</li>
      <li>تفعل على المروة كما فعلت على الصفا. لا تُشترط الطهارة للسعي لكنها أفضل.</li>
    </ul>` },
  { t:'الحلق أو التقصير — والتحلّل', body:`
    <ul class="clean">
      <li>الرجل: الحلق أفضل (دعا النبي ﷺ للمحلّقين ثلاثاً)، أو التقصير من جميع الرأس.</li>
      <li>المرأة: تجمع شعرها وتقصّ منه قدر أنملة (نحو ٢ سم).</li>
      <li>بذلك تمّت عمرتك وحلّ لك كل ما حُرّم بالإحرام. تقبّل الله منك 🤲</li>
    </ul>` }
];

/* ================== البيانات: الأذكار والأدعية ================== */
const ADHKAR = {
  'السفر':[
    {x:'الله أكبر، الله أكبر، الله أكبر، ﴿سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ﴾، اللهم إنا نسألك في سفرنا هذا البر والتقوى، ومن العمل ما ترضى، اللهم هوّن علينا سفرنا هذا واطوِ عنا بُعده، اللهم أنت الصاحب في السفر، والخليفة في الأهل، اللهم إني أعوذ بك من وعثاء السفر، وكآبة المنظر، وسوء المنقلب في المال والأهل', s:'دعاء السفر — رواه مسلم'},
    {x:'أعوذ بكلمات الله التامات من شر ما خلق', s:'عند النزول بمكان — رواه مسلم', c:3},
    {x:'أستودعكم الله الذي لا تضيع ودائعه', s:'توديع الأهل — رواه ابن ماجه'},
    {x:'آيبون، تائبون، عابدون، لربنا حامدون', s:'عند الرجوع من السفر — متفق عليه'}
  ],
  'المسجد':[
    {x:'أعوذ بالله العظيم، وبوجهه الكريم، وسلطانه القديم، من الشيطان الرجيم', s:'عند دخول المسجد — رواه أبو داود'},
    {x:'بسم الله، والصلاة والسلام على رسول الله، اللهم افتح لي أبواب رحمتك', s:'دخول المسجد — رواه مسلم'},
    {x:'بسم الله، والصلاة والسلام على رسول الله، اللهم إني أسألك من فضلك', s:'الخروج من المسجد — رواه مسلم'}
  ],
  'الصباح والمساء':[
    {x:'آية الكرسي: الله لا إله إلا هو الحي القيوم، لا تأخذه سنة ولا نوم، له ما في السماوات وما في الأرض، من ذا الذي يشفع عنده إلا بإذنه، يعلم ما بين أيديهم وما خلفهم، ولا يحيطون بشيء من علمه إلا بما شاء، وسع كرسيه السماوات والأرض، ولا يؤوده حفظهما، وهو العلي العظيم', s:'البقرة ٢٥٥', c:1},
    {x:'سورة الإخلاص، والفلق، والناس', s:'رواه أبو داود والترمذي', c:3},
    {x:'أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير (وفي المساء: أمسينا وأمسى الملك لله)', s:'رواه مسلم', c:1},
    {x:'اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك عليّ، وأبوء بذنبي فاغفر لي، فإنه لا يغفر الذنوب إلا أنت', s:'سيد الاستغفار — رواه البخاري', c:1},
    {x:'بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم', s:'رواه أبو داود والترمذي', c:3},
    {x:'رضيت بالله رباً، وبالإسلام ديناً، وبمحمد ﷺ نبياً', s:'رواه أبو داود', c:3},

function buildPlan(){
  const total = Math.max(1, +settings.days||15);
  const md = Math.min(total, Math.max(0, +settings.meccaDays||8));
  const nd = total - md;
  const fill = (tpl, n, city) => {
    const out=[]; for(let i=0;i<n;i++){
      let it;
      if(i===0) it=tpl[0]; else if(i===n-1 && n>1) it=tpl[tpl.length-1];
      else { const mid = tpl.slice(1,-1); it = mid[(i-1)%mid.length]; }
      out.push({city, t:it[0], d:it[1]});
    } return out; };
  let m = fill(MECCA_PLAN, md, 'مكة'), n = fill(MEDINA_PLAN, nd, 'المدينة');
  if(settings.order==='medina'){
    // إن بدأ بالمدينة فالعمرة عند الوصول لمكة، ويُنبَّه على الإحرام من ذي الحليفة
    if(n.length) n[n.length-1] = {city:'المدينة', t:'الإحرام من ذي الحليفة والسفر لمكة', d:'اغتسل والبس الإحرام وانوِ العمرة عند مسجد الميقات.'};
    return n.concat(m);
  }
  return m.concat(n);
}
function tripDay(){
  if(!settings.start) return null;
  const s = new Date(settings.start+'T00:00:00'); const now = new Date(); now.setHours(0,0,0,0);
  return Math.floor((now - s)/86400000) + 1;
}

function julian(y,m,d){ if(m<=2){y--;m+=12;} const A=Math.floor(y/100),B=2-A+Math.floor(A/4); return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; }
function sunPos(jd){
  const D=jd-2451545.0, g=fix(357.529+0.98560028*D,360), q=fix(280.459+0.98564736*D,360);
  const L=fix(q+1.915*Math.sin(dtr(g))+0.020*Math.sin(dtr(2*g)),360), e=23.439-0.00000036*D;
  const RA=fix(rtd(Math.atan2(Math.cos(dtr(e))*Math.sin(dtr(L)),Math.cos(dtr(L))))/15,24);
  return {decl:rtd(Math.asin(Math.sin(dtr(e))*Math.sin(dtr(L)))), eqt:q/15-RA};
}
function prayerTimes(date, c){
  const tz=3, jd0=julian(date.getFullYear(),date.getMonth()+1,date.getDate())-c.lng/(15*24);
  const mid=t=>{const eq=sunPos(jd0+t).eqt; return fix(12-eq,24);};
  const ang=(a,t,ccw)=>{const p=sunPos(jd0+t), n=mid(t);
    const v=(-Math.sin(dtr(a))-Math.sin(dtr(p.decl))*Math.sin(dtr(c.lat)))/(Math.cos(dtr(p.decl))*Math.cos(dtr(c.lat)));
    const h=rtd(Math.acos(Math.max(-1,Math.min(1,v))))/15; return n+(ccw?-h:h);};
  const asr=t=>{const p=sunPos(jd0+t); const a=-rtd(Math.atan(1/(1+Math.tan(dtr(Math.abs(c.lat-p.decl)))))); return ang(a,t);};
  const adj=t=>t+tz-c.lng/15;
  const fajr=adj(ang(18.5,5/24,true)), sunrise=adj(ang(0.833,6/24,true)), dhuhr=adj(mid(12/24))+1/60,
        asrT=adj(asr(13/24)), maghrib=adj(ang(0.833,18/24));
  return [['الفجر',fajr],['الشروق',sunrise],['الظهر',dhuhr],['العصر',asrT],['المغرب',maghrib],['العشاء',maghrib+1.5]];
}
const fmtT=h=>{h=fix(h+0.5/60,24);const H=Math.floor(h),M=Math.floor((h-H)*60);return AR(String(H).padStart(2,'0')+':'+String(M).padStart(2,'0'));};
function saudiNow(){ const n=new Date(); return new Date(n.getTime()+n.getTimezoneOffset()*60000+3*3600000); }

/* ================== تحديد المدينة ================== */
function currentCity(){
  if(settings.city!=='auto') return settings.city;
  const g = S.get('geo', null);
  if(g){ const dM=Math.hypot(g.lat-21.42,g.lng-39.83), dD=Math.hypot(g.lat-24.47,g.lng-39.61); return dM<dD?'mecca':'medina'; }
  const d=tripDay(), plan=buildPlan();
  if(d && d>=1 && d<=plan.length) return plan[d-1].city==='مكة'?'mecca':'medina';
  return 'mecca';
}
function locate(){
  if(!navigator.geolocation){ toast('الموقع غير متاح'); return; }
  navigator.geolocation.getCurrentPosition(p=>{ S.set('geo',{lat:p.coords.latitude,lng:p.coords.longitude}); settings.city='auto'; saveSettings(); toast('تم تحديد موقعك ✓'); render(); },
    ()=>toast('تعذّر تحديد الموقع'), {timeout:10000});
}

/* ================== المساعد الذكي: ماذا أفعل الآن؟ ================== */
function smartNow(){
  const c=CITIES[currentCity()], sn=saudiNow(), h=sn.getHours()+sn.getMinutes()/60;
  const pt=prayerTimes(sn,c).filter(p=>p[0]!=='الشروق');
  let next=pt.find(p=>p[1]>h); const nextName=next?next[0]:'الفجر';
  let diff=next? next[1]-h : (24-h)+pt[0][1];
  const mins=Math.round(diff*60);
  const done=S.get('stepsDone',[]);
  const umrahDone = done.length>=STEPS.length;
  const d=tripDay(), plan=buildPlan();
  let tip='';
  if(d && d>=1 && d<=plan.length && !umrahDone && plan[d-1].city==='مكة') tip='🕋 لم تكمل خطوات العمرة بعد — افتح «المناسك» وتابع خطوة بخطوة.';
  else if(mins<=30) tip=`🕌 بقي ${AR(mins)} دقيقة على ${nextName} — توجّه إلى المسجد الآن، وجدّد الوضوء.`;
  else if(h>pt[0][1] && h<pt[0][1]+2) tip='☀️ وقت أذكار الصباح — افتح «الأذكار».';
  else if(h>=pt[3][1] && h<pt[4][1]) tip='🌇 بين العصر والمغرب: وقت أذكار المساء والدعاء.';
  else if(h>=0 && h<pt[0][1]-0.5) tip='🌙 الثلث الأخير من الليل: وقت نزول الرحمة — صلِّ ما تيسّر وادعُ، والطواف الآن أخف زحاماً.';
  else if(d && d>=1 && d<=plan.length) tip='📅 برنامج اليوم: '+plan[d-1].t;
  else tip='📿 أكثِر من الذكر والصلاة على النبي ﷺ.';
  return {next:nextName, mins, tip, city:c.n};
}

  on('[data-city]','click',e=>{settings.city=e.currentTarget.dataset.city; saveSettings(); render();});
  on('#locBtn','click',locate);
  on('#qSave','click',()=>{const v=$('#qStart').value; if(v){settings.start=v; saveSettings(); render();}});
  on('[data-step]','click',e=>{const i=+e.currentTarget.dataset.step; let d=S.get('stepsDone',[]); d=d.includes(i)?d.filter(x=>x!==i):[...d,i]; S.set('stepsDone',d); vib(30); if(d.length===STEPS.length) toast('تقبّل الله عمرتك 🤲'); render();});
  on('#resetSteps','click',e=>{ const b=e.currentTarget; if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='اضغط مرة أخرى للتأكيد'; return; } S.set('stepsDone',[]);S.set('tawaf',0);S.set('sai',0);toast('تمت إعادة الضبط');render();});
  const ringTap=(key,max,msg)=>()=>{let n=S.get(key,0); if(n>=max){toast(msg);return;} n++; S.set(key,n); vib(n===max?[100,60,100]:40); if(n===max) toast(msg); render();};
  on('#twRing','click',ringTap('tawaf',7,'اكتمل الطواف ✓ — صلِّ ركعتين خلف المقام'));
  on('#saRing','click',ringTap('sai',7,'اكتمل السعي ✓ — احلق أو قصّر'));
  on('[data-reset]','click',e=>{S.set(e.currentTarget.dataset.reset,0); render();});
  on('[data-minus]','click',e=>{const k=e.currentTarget.dataset.minus; S.set(k,Math.max(0,S.get(k,0)-1)); render();});
  on('[data-cat]','click',e=>{sub.adhkar=e.currentTarget.dataset.cat; render();});
  on('[data-cnt]','click',e=>{const b=e.currentTarget,k=b.dataset.cnt,m=+b.dataset.max,c=S.get('dhikrCount',{}); c[k]=Math.min(m,(c[k]||0)+1); S.set('dhikrCount',c); vib(c[k]===m?120:20);
    b.textContent=AR(c[k])+'/'+AR(m); b.classList.toggle('done',c[k]>=m);});
  on('[data-rcnt]','click',e=>{const p=e.currentTarget.dataset.rcnt,c=S.get('dhikrCount',{}); Object.keys(c).forEach(k=>{if(k.startsWith(p))delete c[k];}); S.set('dhikrCount',c); render();});
  on('#addDua','click',()=>{const v=$('#myDua').value.trim(); if(!v)return; const a=S.get('myDuas',[]); a.push(v); S.set('myDuas',a); render();});
  on('[data-del]','click',e=>{e.preventDefault(); const a=S.get('myDuas',[]); a.splice(+e.currentTarget.dataset.del,1); S.set('myDuas',a); render();});
  on('[data-pc]','click',e=>{sub.places=e.currentTarget.dataset.pc; render();});
  on('[data-visit]','click',e=>{const v=S.get('visited',{}),n=e.currentTarget.dataset.visit; v[n]=!v[n]; S.set('visited',v); render();});
  on('[data-more]','click',e=>{sub.more=e.currentTarget.dataset.more; render();});
  on('[data-mc]','click',e=>{S.set('mapCity',e.currentTarget.dataset.mc); render();});
  on('#saveHotel','click',()=>{S.set('hotel_'+S.get('mapCity','mecca'),$('#hotel').value.trim()); toast('تم الحفظ'); render();});
  on('#tsRing','click',()=>{const n=S.get('tasbih',0)+1,tg=S.get('tasbihTarget',33); S.set('tasbih',n); vib(n%tg===0?[120,60,120]:15); render();});
  on('[data-tg]','click',e=>{S.set('tasbihTarget',+e.currentTarget.dataset.tg); render();});
  on('[data-pack]','change',e=>{const o=S.get('pack',{}); o[e.currentTarget.dataset.pack]=e.currentTarget.checked; S.set('pack',o); render();});
  on('#notes','input',e=>S.set('notes',e.currentTarget.value));
  on('#sSave','click',()=>{Object.assign(settings,{name:$('#sName').value.trim(),start:$('#sStart').value,days:+$('#sDays').value||15,meccaDays:+$('#sMecca').value||0,order:$('#sOrder').value,city:$('#sCity').value,big:$('#sBig').checked}); saveSettings(); hdr(); toast('تم حفظ الإعدادات ✓'); render();});
  if(deferredPrompt){ const b=$('#installBtn'); if(b){ b.classList.remove('hidden'); b.onclick=()=>{deferredPrompt.prompt(); deferredPrompt=null;}; } }
}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.v; render();}));

/* ================== PWA ================== */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault(); deferredPrompt=e;});
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

hdr(); render();
setInterval(()=>{ if(view==='home' && !document.activeElement.matches('input,textarea,select')) render(); }, 60000);
</script>
</body>
</html>
