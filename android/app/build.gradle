plugins { id 'com.android.application' }

def vCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'ma.said.omra'
    compileSdk 34
    defaultConfig {
        applicationId "ma.said.omra"
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName "1.0." + vCode
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "omra.jks")
            storePassword System.getenv("KEYSTORE_PASS") ?: "omrasaid2026"
            keyAlias "omra"
            keyPassword System.getenv("KEYSTORE_PASS") ?: "omrasaid2026"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
