# نشر تلقائي: كل تعديل يُرفع إلى main يُنشر على GitHub Pages
# ويختم رقم إصدار جديد، فيتحدث التطبيق على الهواتف تلقائياً.
name: Deploy عمرة سعيد

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: ختم رقم الإصدار
        run: |
          VER="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/${VER}/g" sw.js index.html
          echo "Version: $VER"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
